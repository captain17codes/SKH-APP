                    "fontFamily": {

<body>
<div id="sidebar-overlay" class="sidebar-overlay" onclick="toggleSidebar()"></div> class="h-full font-body-md text-on-surface bg-background flex items-center justify-center relative overflow-hidden">
<!-- Background Map -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40 grayscale" data-alt="A soft, highly desaturated, high-angle aerial map view of a well-organized city grid, typical of urban planning interfaces. The lighting is soft and diffuse, creating a clean, modern, light-mode background suitable for a corporate civic application. Minimal contrast to not distract from foreground elements. No text is visible." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBvla6YJRY3I2WTBArEuMoEZupGAGbyWAEoDMW84kFApUyor0D_66joxJFtAr6WyaWIiE3vTVE_X2mONMVROTZoP2tVcCHlixUvsQUfkirSwnX8d7KzPKb6mA1YNsDau17rGKF4EtJK1prjRDic85uvnxHjTqTvu1EFIpfC9JZ_Wwxt5KqVe2IiOzaeiW90OZiw-3juCe8RNWi8chSCgS7a43OL27aQfVUazVR0wWcbHPbuFa6uRdE3-w');"></div>
<div class="absolute inset-0 z-0 bg-surface/60 backdrop-blur-[2px]"></div>
<!-- Decorative Pin (Optional, for visual flair) -->
<div class="absolute z-0 flex flex-col items-center justify-center opacity-30 transform -translate-y-12">
<span class="material-symbols-outlined text-[120px] text-primary" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<!-- Center Card -->
<div class="relative z-10 w-full max-w-md mx-auto p-8 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant/30 flex flex-col gap-6">
<!-- Header -->
<div class="flex flex-col items-center text-center gap-2">
<div class="w-16 h-16 rounded-full bg-primary-container flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-[32px] text-on-primary-container" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary">Kopargaon Smart City</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Administrator Console</p>
</div>
<!-- Role Switcher -->
<div class="flex bg-surface-container-highest rounded-lg p-1 gap-1">
<button class="flex-1 py-2 px-4 rounded-md font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-inset">Citizen</button>
<button class="flex-1 py-2 px-4 rounded-md font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-inset">Business</button>
<button class="flex-1 py-2 px-4 rounded-md bg-surface-container-lowest text-primary shadow-sm font-label-sm text-label-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-inset">Administrator</button>
</div>
<!-- Form -->
<form onsubmit="handleSignIn(event)" class="flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-secondary-container focus:ring-2 focus:ring-secondary-container/50 outline-none transition-all font-body-md text-body-md placeholder:text-outline" id="email" name="email" placeholder="admin@kopargaon.gov" type="email"/>
</div>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-label-sm text-label-sm text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">lock</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface-container-lowest focus:border-secondary-container focus:ring-2 focus:ring-secondary-container/50 outline-none transition-all font-body-md text-body-md placeholder:text-outline" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center justify-between mt-1">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="rounded border-outline-variant text-primary focus:ring-primary w-4 h-4 transition-colors group-hover:border-primary" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors">Remember me</span>
</label>
</div>
<button class="w-full py-3.5 bg-primary-container text-on-primary-container rounded-lg font-label-md text-label-md hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm mt-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[20px]">login</span>
</button>
</form>
<!-- Footer Links -->
<div class="flex flex-col gap-4 mt-2 pt-6 border-t border-outline-variant/50 text-center">
<a class="font-body-sm text-body-sm text-primary hover:underline underline-offset-4 decoration-primary/50 transition-all nav-link" href="#">Forgot your password? Reset it</a>
<p class="font-body-sm text-body-sm text-on-surface-variant">
                New here? <a class="text-primary hover:underline underline-offset-4 decoration-primary/50 font-medium transition-all nav-link" href="#">Create an account</a>
</p>
</div>
</div>
<script src="js/app.js"></script>
</body></html>
